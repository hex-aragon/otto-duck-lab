<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오또 리모컨</title>
<style>
/* 폰 한 손 조작: 위 연결 → 가운데 방향 패드 → 아래 춤·설정. 큰 버튼 */
:root{
  --bg:#f2f4f7; --panel:#fff; --fg:#18202b; --muted:#5e6875; --line:#d7dde5;
  --go:#2463c9; --stop:#d23b2f; --dance:#7a4fc4; --ok:#1f8a52;
  font-family:system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--panel:#1c222b;--fg:#e9eef4;--muted:#9ea9b6;--line:#323b46;--go:#5e95ff;--dance:#a07ef0;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);padding:16px max(16px,env(safe-area-inset-left)) 32px}
main{max-width:520px;margin:0 auto;display:grid;gap:14px}
h1{margin:0;font-size:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:17px;font-weight:600;border:0;border-radius:12px;padding:14px 10px;background:var(--line);color:var(--fg);cursor:pointer;touch-action:manipulation;min-height:56px}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
button:disabled{opacity:.4}
.conn button{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pad .go{background:var(--go);color:#fff;font-size:22px}
.pad .stop{background:var(--stop);color:#fff}
.dance{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dance button{background:var(--dance);color:#fff}
.set{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
label{font-size:14px;color:var(--muted);display:grid;gap:4px}
input[type=range]{width:100%}
#status{font-size:14px;color:var(--muted)}
#status.on{color:var(--ok);font-weight:700}
#log{font:12px/1.4 ui-monospace,monospace;background:var(--bg);border-radius:8px;padding:8px;height:110px;overflow:auto;white-space:pre-wrap;margin:0}
.send{display:flex;gap:8px}.send input{flex:1;min-width:0;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.send button{min-height:44px;padding:8px 14px}
.faces{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.faces button{font-size:15px;min-height:48px;padding:8px 4px}
.sounds button{background:#1f8a7a;color:#fff}
.modes button{background:#8a5a1f;color:#fff}
.modes button.on{outline:3px solid var(--ok)}
h2{margin:0;font-size:16px;color:var(--muted)}
#dist{font-size:28px;font-weight:800}
#voice.on{background:var(--stop);color:#fff}
</style>
<main>
  <h1>오또 리모컨</h1>

  <section class="card">
    <div class="row conn">
      <button id="usb">노트북 연결<br><small>USB · 블루투스 COM</small></button>
      <button id="bt">BLE 연결<br><small>폰 크롬 · BLE 모듈</small></button>
    </div>
    <div id="status">연결 안 됨</div>
    <div style="font-size:13px;color:var(--muted)">JDY-31 같은 클래식 모듈: 노트북에서 페어링 후 <b>노트북 연결</b> → "Bluetooth 링크를 통한 표준 직렬(COM)" 중 보내는 쪽 포트 선택</div>
  </section>

  <section class="card">
    <div class="pad">
      <span></span><button class="go" data-c="w 4">▲ 앞</button><span></span>
      <button class="go" data-c="l 3">◀ 왼쪽</button><button class="stop" data-c="x">■ 멈춤</button><button class="go" data-c="r 3">오른쪽 ▶</button>
      <span></span><button class="go" data-c="b 4">▼ 뒤</button><span></span>
    </div>
  </section>

  <section class="card">
    <div class="dance">
      <button data-c="u 3">위아래</button><button data-c="s 3">좌우 흔들기</button>
      <button data-c="m 3">문워크</button><button data-c="k 3">까치발</button>
      <button data-c="d">데모 시작</button><button data-c="h">차렷 (90°)</button>
    </div>
  </section>

  <section class="card">
    <h2>표정 (도트)</h2>
    <div class="faces">
      <button data-c="e eyes">👀 눈</button><button data-c="e smile">🙂 웃음</button><button data-c="e happy">😆 신남</button><button data-c="e sad">😢 슬픔</button>
      <button data-c="e surprise">😮 놀람</button><button data-c="e heart">❤ 하트</button><button data-c="e x">✖ 엑스</button><button data-c="e off">끄기</button>
    </div>
    <h2>소리 (부저)</h2>
    <div class="faces sounds">
      <button data-c="z beep">삐</button><button data-c="z hello">안녕</button><button data-c="z happy">신남</button><button data-c="z sad">슬픔</button>
      <button data-c="z alarm">경고</button><button data-c="z ok">확인</button><button data-c="z song">노래</button><button data-c="mute">음소거</button>
    </div>
  </section>

  <section class="card">
    <h2>초음파 센서</h2>
    <div class="row"><div>앞까지 거리 <span id="dist">-</span></div></div>
    <div class="faces modes">
      <button data-c="test">🔧 자동 점검</button><button data-c="dist">한 번 재기</button><button id="watch">계속 재기</button>
      <button data-mode="guard">장애물 피하기</button><button data-mode="follow">손 따라오기</button>
      <button data-mode="react">손 대면 반응</button><button data-mode="off">센서 끔</button>
    </div>
  </section>

  <section class="card">
    <h2>말로 시키기 (크롬)</h2>
    <button id="voice">🎤 말하기 시작</button>
    <div style="font-size:13px;color:var(--muted)">예: "앞으로", "뒤로", "왼쪽", "오른쪽", "멈춰", "춤춰", "웃어", "하트", "인사해", "노래해", "따라와", "장애물 조심"</div>
    <div id="heard" style="font-size:14px"></div>
  </section>

  <section class="card">
    <div class="set">
      <label>속도 (한 걸음 <b id="pv">1000</b>ms)<input id="p" type="range" min="600" max="2000" step="100" value="1000"></label>
      <label>보폭 <b id="av">100</b>%<input id="a" type="range" min="30" max="100" step="10" value="100"></label>
    </div>
    <div class="send"><input id="cmd" placeholder="직접 명령 (예: t 2 -4, save, show)" autocomplete="off"><button id="sendb">보내기</button></div>
    <pre id="log"></pre>
  </section>
</main>
<script>
// 지원하는 BLE UART 서비스: HM-10/BT05/AT-09/JDY-08(FFE0/FFE1), Nordic UART, 일부 JDY(FFF0)
const BLE = [
  { svc: 0xffe0, rx: 0xffe1, tx: 0xffe1 },
  { svc: '6e400001-b5a3-f393-e0a9-e50e24dcca9e', rx: '6e400002-b5a3-f393-e0a9-e50e24dcca9e', tx: '6e400003-b5a3-f393-e0a9-e50e24dcca9e' },
  { svc: 0xfff0, rx: 0xfff2, tx: 0xfff1 },
];
const $ = id => document.getElementById(id);
let writeFn = null;
const enc = new TextEncoder(), dec = new TextDecoder();

let rxBuf='';
function onText(t){ rxBuf+=t; let i; while((i=rxBuf.indexOf('\n'))>=0){ const line=rxBuf.slice(0,i).replace('\r',''); rxBuf=rxBuf.slice(i+1); log(line); const m=line.match(/거리 (\d+)cm/); if(m) $('dist').textContent=m[1]+' cm'; } }
function log(s){ const l=$('log'); l.textContent += s; if(!s.endsWith('\n')) l.textContent+='\n'; l.scrollTop=l.scrollHeight; }
function setStatus(t,on){ $('status').textContent=t; $('status').classList.toggle('on',!!on); }

async function send(c){
  if(!writeFn){ setStatus('먼저 연결하세요'); return; }
  try{ await writeFn(enc.encode(c+'\n')); log('> '+c); }catch(e){ log('보내기 실패: '+e.message); }
}

$('bt').onclick = async () => {
  if(!navigator.bluetooth){ setStatus('이 브라우저는 블루투스 웹 연결을 지원하지 않아요 (안드로이드·PC 크롬 사용, 아이폰 불가)'); return; }
  try{
    const dev = await navigator.bluetooth.requestDevice({ acceptAllDevices:true, optionalServices: BLE.map(b=>b.svc) });
    setStatus(dev.name+' 연결 중…');
    const gatt = await dev.gatt.connect();
    let rxC=null, txC=null;
    for(const b of BLE){
      try{ const s=await gatt.getPrimaryService(b.svc); rxC=await s.getCharacteristic(b.rx); txC=await s.getCharacteristic(b.tx); break; }catch(e){}
    }
    if(!rxC){ setStatus('이 모듈에서 UART 서비스를 못 찾았어요. 클래식 블루투스(HC-05/06)일 수 있어요'); gatt.disconnect(); return; }
    try{ await txC.startNotifications(); txC.addEventListener('characteristicvaluechanged', e=>onText(dec.decode(e.target.value,{stream:true}))); }catch(e){}
    writeFn = async data => { for(let i=0;i<data.length;i+=20){ const part=data.slice(i,i+20); rxC.writeValueWithoutResponse ? await rxC.writeValueWithoutResponse(part) : await rxC.writeValue(part); } };
    dev.addEventListener('gattserverdisconnected', ()=>{ writeFn=null; setStatus('연결 끊김'); });
    setStatus('블루투스 연결됨: '+(dev.name||'모듈'), true);
  }catch(e){ setStatus('연결 취소/실패: '+e.message); }
};

$('usb').onclick = async () => {
  if(!navigator.serial){ setStatus('이 브라우저는 시리얼 연결을 지원하지 않아요 (노트북 크롬·엣지 사용)'); return; }
  try{
    const port = await navigator.serial.requestPort();
    await port.open({ baudRate: 9600 });
    const w = port.writable.getWriter();
    writeFn = d => w.write(d);
    setStatus('연결됨 (USB면 보드가 재시작해요, 2초 뒤 명령)', true);
    (async()=>{ const r=port.readable.getReader(); try{ for(;;){ const {value,done}=await r.read(); if(done)break; onText(dec.decode(value,{stream:true})); } }catch(e){} })();
  }catch(e){ setStatus('연결 취소/실패: '+e.message); }
};

document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>send(b.dataset.c));
$('p').oninput=e=>$('pv').textContent=e.target.value; $('p').onchange=e=>send('p '+e.target.value);
$('a').oninput=e=>$('av').textContent=e.target.value; $('a').onchange=e=>send('a '+e.target.value);
$('sendb').onclick=()=>{ const v=$('cmd').value.trim(); if(v){ send(v); $('cmd').value=''; } };
$('cmd').onkeydown=e=>{ if(e.key==='Enter') $('sendb').click(); };

// 센서 모드 버튼
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{ send('mode '+b.dataset.mode); document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on', x===b && b.dataset.mode!=='off')); });
let watching=false;
$('watch').onclick=()=>{ watching=!watching; send('watch '+(watching?'on':'off')); $('watch').textContent=watching?'재기 멈춤':'계속 재기'; };

// 음성 명령: 들은 문장에서 낱말을 찾아 명령으로 바꾼다 (크롬 음성 인식, 인터넷 필요)
const VOICE = [
  [/멈|정지|그만|스톱/, ['x']],
  [/앞/, ['w 4']], [/뒤/, ['b 4']], [/왼/, ['l 3']], [/오른/, ['r 3']],
  [/춤/, ['e happy','u 3','s 3']], [/문워크/, ['m 3']], [/까치발/, ['k 3']],
  [/웃/, ['e smile']], [/하트|사랑/, ['e heart','z happy']], [/놀라/, ['e surprise','z alarm']], [/슬퍼|울어/, ['e sad','z sad']],
  [/인사|안녕/, ['e happy','z hello']], [/노래/, ['z song']], [/거리/, ['dist']],
  [/따라/, ['mode follow']], [/조심|장애물/, ['mode guard','w 6']], [/차렷/, ['h']],
];
async function runVoice(text){
  for(const [re,cmds] of VOICE){ if(re.test(text)){ for(const c of cmds){ await send(c); await new Promise(r=>setTimeout(r,300)); } return true; } }
  return false;
}
let rec=null;
$('voice').onclick=()=>{
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ $('heard').textContent='이 브라우저는 음성 인식을 지원하지 않아요 (크롬 사용)'; return; }
  if(rec){ rec.stop(); return; }
  rec=new SR(); rec.lang='ko-KR'; rec.continuous=true; rec.interimResults=false;
  rec.onresult=async e=>{ const t=e.results[e.results.length-1][0].transcript.trim(); const ok=await runVoice(t); $('heard').textContent='들은 말: "'+t+'"'+(ok?'':' → 아는 명령이 없어요'); };
  rec.onend=()=>{ rec=null; $('voice').classList.remove('on'); $('voice').textContent='🎤 말하기 시작'; };
  rec.onerror=e=>{ $('heard').textContent='음성 인식 오류: '+e.error; };
  rec.start(); $('voice').classList.add('on'); $('voice').textContent='■ 듣는 중 (누르면 멈춤)';
};
</script>
</html>
